name: ci
on:
  push:
  pull_request:
jobs:
  test:
    # Self-hosted ARC runners on gpierre (scale set gpierre-tower-bot): GitHub-hosted minutes are
    # unavailable. The pods have no Docker, so there is no `services:` block: each runner pod runs
    # Postgres 16 beside the runner on localhost:5432 (user postgres, password postgres).
    runs-on: gpierre-tower-bot
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy tower_bot
      - run: pytest -q
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
